name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  Linux_Bare:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build package
      working-directory: driver
      run: |
        make -j$(nproc)
        sudo make install
        if ! lsmod | grep -q "^px4_drv"; then
          echo "Error: px4_drv is not loaded"
          exit 1
        fi
        echo "Success: px4_drv is loaded"

  Linux_Container:
    strategy:
      matrix:
        platform: [ubuntu-24.04, ubuntu-24.04-arm]
        images:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bullseye
          - debian:bookworm

    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build container
      run: |
        docker build \
          --build-arg IMAGE="${{ matrix.images }}" \
          -t builder \
          .

    - name: Build package
      run: |
        docker run \
          -v "$(pwd)/driver/:/mnt" \
          builder \
            /bin/sh -c "cd /mnt && make -j$(nproc) deb"
